<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .actor rect { fill:#eef3fa; stroke:#4a7fb5; stroke-width:1.5; rx:8; }
    .ext rect   { fill:#f7efe2; stroke:#b08850; stroke-width:1.5; }
    .sys rect   { fill:#dcebdc; stroke:#4d8a4d; stroke-width:2; }
    .lbl  { font-size:14px; font-weight:600; fill:#222; }
    .sub  { font-size:11px; fill:#555; }
    .edge { stroke:#555; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
    .elbl { font-size:10.5px; fill:#444; }
  </style>

  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Contextdiagram - Jottem / IOTM platform</text>

  <!-- Actors (left) -->
  <g class="actor">
    <rect x="30" y="70" width="170" height="58" rx="8"/>
    <text x="115" y="94" text-anchor="middle" class="lbl">Bezoeker</text>
    <text x="115" y="112" text-anchor="middle" class="sub">bekijkt en doorzoekt jottems</text>
  </g>
  <g class="actor">
    <rect x="30" y="150" width="170" height="58" rx="8"/>
    <text x="115" y="174" text-anchor="middle" class="lbl">Gebruiker</text>
    <text x="115" y="192" text-anchor="middle" class="sub">uploader / annoteerder</text>
  </g>
  <g class="actor">
    <rect x="30" y="230" width="170" height="58" rx="8"/>
    <text x="115" y="254" text-anchor="middle" class="lbl">Moderator</text>
    <text x="115" y="272" text-anchor="middle" class="sub">kwaliteitscontrole, publicatie</text>
  </g>
  <g class="actor">
    <rect x="30" y="310" width="170" height="58" rx="8"/>
    <text x="115" y="334" text-anchor="middle" class="lbl">Beheerder</text>
    <text x="115" y="352" text-anchor="middle" class="sub">platform- / organisatiebeheer</text>
  </g>
  <g class="actor">
    <rect x="30" y="390" width="170" height="58" rx="8"/>
    <text x="115" y="414" text-anchor="middle" class="lbl">API-gebruiker</text>
    <text x="115" y="432" text-anchor="middle" class="sub">harvesters, aggregators</text>
  </g>

  <!-- Central system -->
  <g class="sys">
    <rect x="330" y="170" width="300" height="180" rx="10"/>
    <text x="480" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#1e4d1e">Jottem platform</text>
    <text x="480" y="228" text-anchor="middle" class="sub">participatief digitaal erfgoedplatform</text>
    <text x="480" y="252" text-anchor="middle" class="sub">upload, moderatie, annotatie, publicatie</text>
    <text x="480" y="272" text-anchor="middle" class="sub">IIIF - W3C Annotations - RDF - ARK</text>
    <text x="480" y="300" text-anchor="middle" class="sub">*.iotm.nl</text>
  </g>

  <!-- External systems (right) -->
  <g class="ext">
    <rect x="760" y="60" width="195" height="56" rx="4"/>
    <text x="857" y="83" text-anchor="middle" class="lbl">Social login providers</text>
    <text x="857" y="101" text-anchor="middle" class="sub">Google, Facebook, e.a. (OIDC)</text>
  </g>
  <g class="ext">
    <rect x="760" y="140" width="195" height="56" rx="4"/>
    <text x="857" y="163" text-anchor="middle" class="lbl">Internet Archive</text>
    <text x="857" y="181" text-anchor="middle" class="sub">duurzame opslag (backup)</text>
  </g>
  <g class="ext">
    <rect x="760" y="220" width="195" height="56" rx="4"/>
    <text x="857" y="243" text-anchor="middle" class="lbl">NDE Datasetregister</text>
    <text x="857" y="261" text-anchor="middle" class="sub">datasetbeschrijvingen</text>
  </g>
  <g class="ext">
    <rect x="760" y="300" width="195" height="56" rx="4"/>
    <text x="857" y="323" text-anchor="middle" class="lbl">Tijdmachines</text>
    <text x="857" y="341" text-anchor="middle" class="sub">kaart / tijdnavigatie</text>
  </g>
  <g class="ext">
    <rect x="760" y="380" width="195" height="56" rx="4"/>
    <text x="857" y="403" text-anchor="middle" class="lbl">E-mailprovider (SMTP)</text>
    <text x="857" y="421" text-anchor="middle" class="sub">bevestigingen, notificaties</text>
  </g>
  <g class="ext">
    <rect x="760" y="460" width="195" height="56" rx="4"/>
    <text x="857" y="483" text-anchor="middle" class="lbl">Terminologiebronnen</text>
    <text x="857" y="501" text-anchor="middle" class="sub">Wikidata, GTAA, e.d. (URI's)</text>
  </g>

  <!-- Edges actors -> system -->
  <path class="edge" d="M200,99 C270,99 280,200 330,210"/>
  <path class="edge" d="M200,179 C260,179 270,220 330,235"/>
  <path class="edge" d="M200,259 L330,260"/>
  <path class="edge" d="M200,339 C260,339 270,300 330,285"/>
  <path class="edge" d="M200,419 C270,419 280,320 330,310"/>
  <text x="252" y="250" class="elbl">HTTPS</text>

  <!-- Edges system -> external -->
  <path class="edge" d="M630,200 C690,180 700,95 760,88"/>
  <text x="668" y="130" class="elbl">OIDC federatie</text>
  <path class="edge" d="M630,225 C690,215 700,170 760,168"/>
  <text x="672" y="192" class="elbl">IA API</text>
  <path class="edge" d="M630,255 L760,250"/>
  <text x="668" y="243" class="elbl">schema.org</text>
  <path class="edge" d="M760,328 C700,330 690,290 630,285"/>
  <text x="662" y="318" class="elbl">IIIF / API</text>
  <path class="edge" d="M630,310 C690,320 700,405 760,408"/>
  <text x="672" y="370" class="elbl">SMTP</text>
  <path class="edge" d="M630,330 C700,350 710,485 760,488"/>
  <text x="662" y="440" class="elbl">SPARQL / REST</text>
</svg>
